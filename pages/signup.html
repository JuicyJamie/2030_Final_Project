<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Typer's Queue: Sign Up</title>
        <link rel="stylesheet" href="./styles/forms.css">
    </head>
    <body>
        <div id="wrapper">
            <h1>Typer's Queue</h1>
            <div id="form-wrapper">
                <span>Sign Up</span>
                <form action="validation.php" method="post">
                    <label for="email">Email Address: </label>
                    <input type="email" name="email" id="email" placeholder="Enter your email address...">

                    <label for="username">Username: </label>
                    <input type="text" name="username" id="username" placeholder="Create your username..." minlength="4" maxlength="16">


                    <label for="password">Password: </label>
                    <input type="password" name="password1" id="password1" placeholder="Create your password...">
                    <input type="password" name="password2" id="password2" placeholder="Confirm your password...">
                </form>                
            </div>
        </div>
    </body>
</html>
