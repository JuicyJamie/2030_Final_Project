<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Typer's Queue</title>
        <script src="scripts/script.js"></script>
        <link rel="stylesheet" href="styles/style.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Iceland&display=swap');

            body {
                background-color: #2c2c2c;
                font-family: "Iceland", sans-serif;
            }
            #wrapper {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                margin-top: 30vh;
            }
            h1, h2, span, a {
                color: #ffffff;
            }
            h2 {
                margin: 0;
                font-size: 2rem;
            }
            #button-wrapper {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                column-gap: 15px;
                row-gap: 15px;
                align-items: center;
            }
            #button-wrapper h1 {
                grid-column: 1/3;
                font-size: 4rem;
                margin: 0;
            }
            #button-wrapper a {
                background-color: #ffffff;
                border: 3px solid transparent;
                border-radius: 10px;
                color: #2c2c2c;
                text-align: center;
                text-decoration: none;
                font-size: 1.5rem;
                padding: 20px;
                transition: background-color 0.5s, color 0.5s;
            }
            #button-wrapper a:hover {
                color: #ffffff;
                background-color: #2c2c2c;
                border: 3px solid #ffffff;
            }
            #login {
                grid-column: 1/2;
                grid-row: 2/3;
            }
            #signup {
                grid-column: 2/3;
                grid-row: 2/3;
            }
            #guest {
                font-size: 1.2rem;
            }
        </style>
    </head>
    <body>
        <div id="wrapper">
            <h2>Welcome to</h2>
            <div id="button-wrapper">
                <h1>Typer's Queue</h1>
                <a href="pages/login.html" id="login">Log In</a>
                <a href="pages/signup.html" id="signup">Sign up</a>
            </div>
            <div id="guest-wrapper">
                <span>or</span>
                <a href="pages/test.html" id="guest"> continue as guest</a>                
            </div>

        </div>
        
    </body>
</html>
